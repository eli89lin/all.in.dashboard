<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL IN 出貨單產生器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
    background: #f4f1ec;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── LEFT PANEL ── */
  #panel {
    width: 360px;
    min-width: 320px;
    background: #1c2b1e;
    color: #e8e2d8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #panel-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid #2e4030;
  }

  #panel-header .logo-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
  }

  #panel-header .subtitle {
    font-size: 11px;
    color: #7a9b7c;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  #panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  #panel-body::-webkit-scrollbar { width: 4px; }
  #panel-body::-webkit-scrollbar-track { background: transparent; }
  #panel-body::-webkit-scrollbar-thumb { background: #2e4030; border-radius: 2px; }

  .section-title {
    font-size: 10px;
    letter-spacing: 2px;
    color: #7a9b7c;
    text-transform: uppercase;
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #2e4030;
  }

  .section-title:first-child { margin-top: 0; }

  .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .field-group.full { grid-template-columns: 1fr; }

  .field label {
    display: block;
    font-size: 10px;
    color: #7a9b7c;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: #2a3d2c;
    border: 1px solid #3a5040;
    border-radius: 6px;
    color: #e8e2d8;
    font-size: 12px;
    padding: 7px 10px;
    font-family: inherit;
    transition: border-color .2s;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: #6b9e6e;
  }

  .field textarea { resize: vertical; min-height: 60px; }

  /* product rows */
  .product-row {
    display: grid;
    grid-template-columns: 22px 1fr 52px 52px auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }

  .product-row .row-num {
    font-size: 11px;
    color: #7a9b7c;
    text-align: center;
  }

  .product-row input {
    background: #2a3d2c;
    border: 1px solid #3a5040;
    border-radius: 6px;
    color: #e8e2d8;
    font-size: 12px;
    padding: 6px 8px;
    font-family: inherit;
    width: 100%;
  }

  .product-row input:focus { outline: none; border-color: #6b9e6e; }

  .btn-remove {
    background: none;
    border: none;
    color: #5a3a3a;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    transition: color .2s;
  }

  .btn-remove:hover { color: #c0504d; }

  .btn-add {
    width: 100%;
    margin-top: 4px;
    padding: 8px;
    background: #2a3d2c;
    border: 1px dashed #3a5040;
    border-radius: 6px;
    color: #7a9b7c;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }

  .btn-add:hover { border-color: #6b9e6e; color: #9ec4a0; }

  .col-header {
    display: grid;
    grid-template-columns: 22px 1fr 52px 52px 24px;
    gap: 6px;
    margin-bottom: 4px;
  }

  .col-header span {
    font-size: 9px;
    color: #5a7a5c;
    letter-spacing: 1px;
    text-align: center;
  }

  .col-header span:nth-child(2) { text-align: left; }

  #panel-footer {
    padding: 16px 24px;
    border-top: 1px solid #2e4030;
    display: flex;
    gap: 10px;
  }

  .btn-print {
    flex: 1;
    padding: 11px;
    background: #4a7c4e;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background .2s;
  }

  .btn-print:hover { background: #5a9c5e; }

  .btn-reset {
    padding: 11px 16px;
    background: #2a3d2c;
    border: 1px solid #3a5040;
    border-radius: 8px;
    color: #7a9b7c;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }

  .btn-reset:hover { border-color: #6b9e6e; color: #9ec4a0; }

  /* ── RIGHT PREVIEW ── */
  #preview-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #ebe7e0;
  }

  #preview {
    background: #fff;
    width: 794px;
    min-height: 1123px;
    padding: 60px 56px;
    box-shadow: 0 4px 32px rgba(0,0,0,.12);
    font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    position: relative;
  }

  .pv-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }

  .pv-logo { width: 140px; height: auto; }
  .pv-logo img { width: 100%; height: auto; display: block; }

  .pv-company {
    text-align: right;
    font-size: 12.5px;
    line-height: 1.9;
    color: #333;
  }

  .pv-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #1a1a1a;
    letter-spacing: 2px;
  }

  .pv-info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 24px;
  }

  .pv-info-table td {
    border: 1px solid #bbb;
    padding: 8px 12px;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .pv-info-table td.label {
    background: #f8f8f6;
    color: #444;
    white-space: nowrap;
    width: 80px;
    font-weight: 500;
  }

  .pv-info-table td.value { min-width: 160px; }
  .pv-info-table td.value-wide { min-width: 400px; }

  .pv-product-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 0;
  }

  .pv-product-table th {
    background: #f8f8f6;
    border: 1px solid #bbb;
    padding: 9px 10px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    color: #333;
  }

  .pv-product-table td {
    border: 1px solid #bbb;
    padding: 8px 10px;
    font-size: 12.5px;
    text-align: center;
    height: 36px;
  }

  .pv-product-table td.product-name { text-align: left; }

  .pv-notes {
    margin-top: 20px;
    font-size: 12.5px;
    line-height: 1.9;
    color: #333;
  }

  .pv-notes .notes-title { font-weight: 700; }

  .pv-sig {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    gap: 40px;
  }

  .pv-sig-block {
    flex: 1;
    font-size: 12.5px;
    line-height: 2;
    border-top: 1px solid #bbb;
    padding-top: 12px;
  }

  .pv-sig-block .sig-title {
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
  }

  .pv-sig-line {
    border-bottom: 1px solid #bbb;
    display: inline-block;
    width: 140px;
    margin-left: 4px;
  }

  .pv-stamp {
    width: 72px;
    height: 72px;
    border: 2px solid #c0504d;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #c0504d;
    font-size: 9.5px;
    text-align: center;
    line-height: 1.4;
    opacity: 0.65;
    transform: rotate(-15deg);
    margin-top: 8px;
  }

  @media print {
    body { height: auto; overflow: visible; }
    #panel { display: none; }
    #preview-wrap { padding: 0; background: #fff; }
    #preview { box-shadow: none; }
  }
</style>
</head>
<body>

<!-- ── LEFT PANEL ── -->
<div id="panel">
  <div id="panel-header">
    <div class="logo-text">ALL IN</div>
    <div class="subtitle">出貨單產生器</div>
  </div>

  <div id="panel-body">

    <div class="section-title">客戶資訊</div>

    <div class="field-group">
      <div class="field">
        <label>客戶名</label>
        <input type="text" id="f-client" placeholder="Capella Taipei">
      </div>
      <div class="field">
        <label>出貨單號</label>
        <input type="text" id="f-order-no" placeholder="20260423001">
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>聯絡人</label>
        <input type="text" id="f-contact">
      </div>
      <div class="field">
        <label>聯絡電話</label>
        <input type="text" id="f-tel">
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>出庫日期</label>
        <input type="text" id="f-ship-date" placeholder="2026/04/23">
      </div>
      <div class="field">
        <label>到貨日期</label>
        <input type="text" id="f-arrive-date" placeholder="2026/04/24">
      </div>
    </div>

    <div class="field-group full">
      <div class="field">
        <label>收件地址</label>
        <input type="text" id="f-address">
      </div>
    </div>

    <div class="section-title">商品明細</div>

    <div class="col-header">
      <span></span>
      <span>商品名稱</span>
      <span>訂貨</span>
      <span>出貨</span>
      <span></span>
    </div>

    <div id="product-list"></div>

    <datalist id="product-presets">
      <option value="全食飲｜黃豆">
      <option value="全食飲｜黑五次方">
      <option value="全食飲｜紅棗核桃">
      <option value="全食飲｜杏仁糙米">
      <option value="小全頭｜南瓜">
      <option value="小全頭｜黃豆">
      <option value="小全頭｜毛豆">
      <option value="小全頭｜紫心甘薯">
      <option value="厚果醬｜腰果">
      <option value="厚果醬｜開心腰果">
      <option value="全方麵｜毛豆">
      <option value="全方麵｜南瓜">
      <option value="全食圈｜南瓜">
      <option value="全食圈｜紫心甘薯">
    </datalist>

    <button class="btn-add" id="btn-add-product">＋ 新增品項</button>

    <div class="section-title">備註</div>

    <div class="field-group full">
      <div class="field">
        <textarea id="f-notes" placeholder="如有特殊配送要求請填寫"></textarea>
      </div>
    </div>

  </div>

  <div id="panel-footer">
    <button class="btn-print" onclick="window.print()">列印 / 匯出 PDF</button>
    <button class="btn-reset" id="btn-reset">重設</button>
  </div>
</div>

<!-- ── RIGHT PREVIEW ── -->
<div id="preview-wrap">
  <div id="preview">

    <div class="pv-header">
      <div class="pv-logo">
        <img src="../logo.jpg" alt="ALL IN 全食理念">
      </div>
      <div class="pv-company">
        歐飲國際股份有限公司<br>
        台北市大安區和平東路二段175巷56號<br>
        02-2700-2211
      </div>
    </div>

    <div class="pv-title">出貨明細</div>

    <table class="pv-info-table">
      <tr>
        <td class="label">客戶名</td>
        <td class="value" id="pv-client"></td>
        <td class="label">出貨單號</td>
        <td class="value" id="pv-order-no"></td>
      </tr>
      <tr>
        <td class="label">聯絡人</td>
        <td class="value" id="pv-contact"></td>
        <td class="label">出庫日期</td>
        <td class="value" id="pv-ship-date"></td>
      </tr>
      <tr>
        <td class="label">聯絡電話</td>
        <td class="value" id="pv-tel"></td>
        <td class="label">到貨日期</td>
        <td class="value" id="pv-arrive-date"></td>
      </tr>
      <tr>
        <td class="label">收件地址</td>
        <td class="value-wide" colspan="3" id="pv-address"></td>
      </tr>
    </table>

    <table class="pv-product-table">
      <thead>
        <tr>
          <th style="width:40px"></th>
          <th>商品名稱</th>
          <th style="width:90px">訂貨數量</th>
          <th style="width:90px">出貨數量</th>
        </tr>
      </thead>
      <tbody id="pv-products"></tbody>
    </table>

    <div class="pv-notes" id="pv-notes-wrap"></div>

    <div class="pv-sig">
      <div class="pv-sig-block">
        <div class="sig-title">出貨確認</div>
        <div>出貨人員：<span class="pv-sig-line"></span></div>
        <div>出庫日期：<span class="pv-sig-line"></span></div>
      </div>
      <div class="pv-sig-block">
        <div class="sig-title">客戶簽收</div>
        <div>簽收人員：<span class="pv-sig-line"></span></div>
        <div>簽收日期：<span class="pv-sig-line"></span></div>
      </div>
      <div class="pv-sig-block" style="text-align:right">
        <div class="sig-title">公司用印</div>
        <div class="pv-stamp">歐飲國際<br>股份有限公司</div>
      </div>
    </div>

  </div>
</div>

<script>
let products = [
  { name: '', ordered: '', shipped: '' },
  { name: '', ordered: '', shipped: '' },
  { name: '', ordered: '', shipped: '' },
];

function today() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return { ymd: `${y}/${m}/${dd}`, compact: `${y}${m}${dd}` };
}

function initDefaults() {
  const t = today();
  document.getElementById('f-ship-date').value = t.ymd;
  document.getElementById('f-order-no').value = t.compact + '001';
}

function renderProductRows() {
  const list = document.getElementById('product-list');
  list.innerHTML = '';
  products.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `
      <span class="row-num">${i + 1}</span>
      <input type="text" list="product-presets" placeholder="商品名稱" value="${p.name}" data-i="${i}" data-f="name">
      <input type="number" placeholder="訂貨" value="${p.ordered}" data-i="${i}" data-f="ordered" style="text-align:center">
      <input type="number" placeholder="出貨" value="${p.shipped}" data-i="${i}" data-f="shipped" style="text-align:center">
      <button class="btn-remove" data-remove="${i}" title="移除">×</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(el => el.addEventListener('input', onProductInput));
  list.querySelectorAll('.btn-remove').forEach(el => el.addEventListener('click', removeProduct));
}

function onProductInput(e) {
  const i = +e.target.dataset.i, f = e.target.dataset.f;
  products[i][f] = e.target.value;
  updatePreview();
}

function removeProduct(e) {
  const i = +e.target.dataset.remove;
  if (products.length > 1) {
    products.splice(i, 1);
    renderProductRows();
    updatePreview();
  }
}

document.getElementById('btn-add-product').addEventListener('click', () => {
  products.push({ name: '', ordered: '', shipped: '' });
  renderProductRows();
});

function v(id) { return document.getElementById(id)?.value?.trim() || ''; }

function updatePreview() {
  const map = {
    'pv-client': 'f-client',
    'pv-order-no': 'f-order-no',
    'pv-contact': 'f-contact',
    'pv-tel': 'f-tel',
    'pv-ship-date': 'f-ship-date',
    'pv-arrive-date': 'f-arrive-date',
    'pv-address': 'f-address',
  };
  for (const [pvId, fId] of Object.entries(map)) {
    document.getElementById(pvId).textContent = v(fId);
  }

  const tbody = document.getElementById('pv-products');
  tbody.innerHTML = '';
  products.forEach((p, i) => {
    if (!p.name && !p.ordered && !p.shipped) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td class="product-name">${p.name || ''}</td>
      <td>${p.ordered || ''}</td>
      <td>${p.shipped || ''}</td>
    `;
    tbody.appendChild(tr);
  });

  // fill blank rows to at least 5 visible lines
  const minRows = 5;
  const filled = products.filter(p => p.name || p.ordered || p.shipped).length;
  for (let i = filled; i < minRows; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>&nbsp;</td><td class="product-name"></td><td></td><td></td>`;
    tbody.appendChild(tr);
  }

  const notes = v('f-notes');
  const notesWrap = document.getElementById('pv-notes-wrap');
  if (notes) {
    const lines = notes.split('\n').filter(l => l.trim());
    notesWrap.innerHTML = `<div class="notes-title">【備註】</div>` +
      lines.map((l, i) => `<div>${i + 1}. ${l}</div>`).join('');
  } else {
    notesWrap.innerHTML = '';
  }
}

const fieldIds = ['f-client','f-order-no','f-contact','f-tel','f-ship-date','f-arrive-date','f-address','f-notes'];
fieldIds.forEach(id => document.getElementById(id)?.addEventListener('input', updatePreview));

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('確定要重設所有欄位嗎？')) return;
  products = [
    { name: '', ordered: '', shipped: '' },
    { name: '', ordered: '', shipped: '' },
    { name: '', ordered: '', shipped: '' },
  ];
  renderProductRows();
  fieldIds.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  initDefaults();
  updatePreview();
});

initDefaults();
renderProductRows();
updatePreview();
</script>
</body>
</html>
