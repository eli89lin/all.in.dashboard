<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL IN 報價單產生器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
    background: #f4f1ec;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── LEFT PANEL ── */
  #panel {
    width: 360px;
    min-width: 320px;
    background: #1c2b1e;
    color: #e8e2d8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #panel-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid #2e4030;
  }

  #panel-header .logo-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
  }

  #panel-header .subtitle {
    font-size: 11px;
    color: #7a9b7c;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  #panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  #panel-body::-webkit-scrollbar { width: 4px; }
  #panel-body::-webkit-scrollbar-track { background: transparent; }
  #panel-body::-webkit-scrollbar-thumb { background: #2e4030; border-radius: 2px; }

  .section-title {
    font-size: 10px;
    letter-spacing: 2px;
    color: #7a9b7c;
    text-transform: uppercase;
    margin: 20px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #2e4030;
  }

  .section-title:first-child { margin-top: 0; }

  .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .field-group.full { grid-template-columns: 1fr; }

  .field label {
    display: block;
    font-size: 10px;
    color: #7a9b7c;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: #2a3d2c;
    border: 1px solid #3a5040;
    border-radius: 6px;
    color: #e8e2d8;
    font-size: 12px;
    padding: 7px 10px;
    font-family: inherit;
    transition: border-color .2s;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: #6b9e6e;
  }

  .field textarea { resize: vertical; min-height: 60px; }

  /* product rows */
  .product-row {
    display: grid;
    grid-template-columns: 24px 1fr 56px 72px auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }

  .product-row .row-num {
    font-size: 11px;
    color: #7a9b7c;
    text-align: center;
  }

  .product-row input {
    background: #2a3d2c;
    border: 1px solid #3a5040;
    border-radius: 6px;
    color: #e8e2d8;
    font-size: 12px;
    padding: 6px 8px;
    font-family: inherit;
    width: 100%;
  }

  .product-row input:focus { outline: none; border-color: #6b9e6e; }

  .btn-remove {
    background: none;
    border: none;
    color: #5a3a3a;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    transition: color .2s;
  }

  .btn-remove:hover { color: #c0504d; }

  .btn-add {
    width: 100%;
    margin-top: 4px;
    padding: 8px;
    background: #2a3d2c;
    border: 1px dashed #3a5040;
    border-radius: 6px;
    color: #7a9b7c;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }

  .btn-add:hover { border-color: #6b9e6e; color: #9ec4a0; }

  #panel-footer {
    padding: 16px 24px;
    border-top: 1px solid #2e4030;
    display: flex;
    gap: 10px;
  }

  .btn-print {
    flex: 1;
    padding: 11px;
    background: #4a7c4e;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background .2s;
  }

  .btn-print:hover { background: #5a9c5e; }

  .btn-reset {
    padding: 11px 16px;
    background: #2a3d2c;
    border: 1px solid #3a5040;
    border-radius: 8px;
    color: #7a9b7c;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }

  .btn-reset:hover { border-color: #6b9e6e; color: #9ec4a0; }

  /* ── RIGHT PREVIEW ── */
  #preview-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #ebe7e0;
  }

  #preview {
    background: #fff;
    width: 794px;
    min-height: 1123px;
    padding: 60px 56px;
    box-shadow: 0 4px 32px rgba(0,0,0,.12);
    font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    position: relative;
  }

  /* preview header */
  .pv-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
  }

  .pv-logo {
    width: 150px;
    height: auto;
  }

  .pv-logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  .pv-company {
    text-align: right;
    font-size: 12.5px;
    line-height: 1.8;
    color: #333;
  }

  .pv-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #1a1a1a;
  }

  /* info table */
  .pv-info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }

  .pv-info-table td {
    border: 1px solid #bbb;
    padding: 8px 12px;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .pv-info-table td.label {
    background: #f8f8f6;
    color: #444;
    white-space: nowrap;
    width: 72px;
    font-weight: 500;
  }

  .pv-info-table td.value { min-width: 160px; }

  /* product table */
  .pv-product-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 0;
  }

  .pv-product-table th {
    background: #f8f8f6;
    border: 1px solid #bbb;
    padding: 9px 10px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    color: #333;
  }

  .pv-product-table td {
    border: 1px solid #bbb;
    padding: 8px 10px;
    font-size: 12.5px;
    text-align: center;
    height: 36px;
  }

  .pv-product-table td.product-name { text-align: left; }

  .pv-product-table td.summary-label {
    text-align: right;
    font-weight: 500;
    background: #f8f8f6;
  }

  .pv-product-table td.summary-value { font-weight: 600; }

  /* notes */
  .pv-notes {
    margin-top: 20px;
    font-size: 12.5px;
    line-height: 1.9;
    color: #333;
  }

  .pv-notes .notes-title { font-weight: 700; }

  /* signature area */
  .pv-sig {
    display: flex;
    justify-content: space-between;
    margin-top: 28px;
    gap: 40px;
  }

  .pv-sig-left, .pv-sig-right { flex: 1; font-size: 12.5px; line-height: 2; }

  .pv-sig-line {
    border-bottom: 1px solid #bbb;
    width: 180px;
    display: inline-block;
  }

  .pv-stamp {
    width: 80px;
    height: 80px;
    border: 2px solid #c0504d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c0504d;
    font-size: 10px;
    text-align: center;
    line-height: 1.4;
    margin-top: 4px;
    opacity: 0.7;
    transform: rotate(-15deg);
  }

  @media print {
    body { height: auto; overflow: visible; }
    #panel { display: none; }
    #preview-wrap { padding: 0; background: #fff; }
    #preview { box-shadow: none; }
  }
</style>
</head>
<body>

<!-- ── LEFT PANEL ── -->
<div id="panel">
  <div id="panel-header">
    <div class="logo-text">ALL IN</div>
    <div class="subtitle">報價單產生器</div>
  </div>

  <div id="panel-body">

    <div class="section-title">客戶資訊</div>

    <div class="field-group">
      <div class="field">
        <label>訂購人</label>
        <input type="text" id="f-buyer" value="華膳空廚股份有限公司">
      </div>
      <div class="field">
        <label>訂購人電話</label>
        <input type="text" id="f-buyer-tel" value="03-3541000 #5453">
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>報價日期</label>
        <input type="text" id="f-date" value="2026.04.19">
      </div>
      <div class="field">
        <label>報價有效至</label>
        <input type="text" id="f-expiry" value="2026.04.26">
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>收件人</label>
        <input type="text" id="f-receiver" value="採購部 曾雪紅">
      </div>
      <div class="field">
        <label>統一編號</label>
        <input type="text" id="f-tax-id" value="89282663">
      </div>
    </div>

    <div class="field-group full">
      <div class="field">
        <label>收件地址</label>
        <input type="text" id="f-address" value="33856 桃園市蘆竹區海山路二段 156 巷 22 號">
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>收件人電話</label>
        <input type="text" id="f-recv-tel" value="03-3541000 #5453">
      </div>
    </div>

    <div class="section-title">產品明細</div>

    <div id="product-list"></div>
    <button class="btn-add" id="btn-add-product">＋ 新增產品列</button>

    <div class="section-title">稅率設定</div>

    <div class="field-group">
      <div class="field">
        <label>稅率（%）</label>
        <input type="number" id="f-tax-rate" value="5" min="0" max="100" step="1">
      </div>
    </div>

    <div class="section-title">備註</div>

    <div class="field-group full">
      <div class="field">
        <textarea id="f-notes">本報價單已包含冷藏運費至客戶指定地點</textarea>
      </div>
    </div>

    <div class="section-title">公司聯絡資訊</div>

    <div class="field-group">
      <div class="field">
        <label>公司名稱</label>
        <input type="text" id="f-company" value="歐飲國際股份有限公司">
      </div>
      <div class="field">
        <label>聯絡人</label>
        <input type="text" id="f-contact" value="林彥辰">
      </div>
    </div>

    <div class="field-group">
      <div class="field">
        <label>聯絡電話</label>
        <input type="text" id="f-company-tel" value="02-2700-2211">
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="text" id="f-email" value="eli.lin@all-in.company">
      </div>
    </div>

  </div>

  <div id="panel-footer">
    <button class="btn-print" onclick="window.print()">列印 / 匯出 PDF</button>
    <button class="btn-reset" id="btn-reset">重設</button>
  </div>
</div>

<script>
// ── State ──
let products = [
  { name: '全食飲｜紅棗核桃', qty: 25, price: 121.43 },
  { name: '', qty: '', price: '' },
  { name: '', qty: '', price: '' },
  { name: '', qty: '', price: '' },
];

// ── Render left product rows ──
function renderProductRows() {
  const list = document.getElementById('product-list');
  list.innerHTML = '';
  products.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `
      <span class="row-num">${i + 1}</span>
      <input type="text" placeholder="產品名稱" value="${p.name}" data-i="${i}" data-f="name">
      <input type="number" placeholder="數量" value="${p.qty}" data-i="${i}" data-f="qty" style="text-align:center">
      <input type="number" placeholder="單價" value="${p.price}" data-i="${i}" data-f="price" style="text-align:right">
      <button class="btn-remove" data-remove="${i}" title="移除">×</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('input').forEach(el => el.addEventListener('input', onProductInput));
  list.querySelectorAll('.btn-remove').forEach(el => el.addEventListener('click', removeProduct));
}

function onProductInput(e) {
  const i = +e.target.dataset.i, f = e.target.dataset.f;
  products[i][f] = f === 'name' ? e.target.value : e.target.value;
  updatePreview();
}

function removeProduct(e) {
  const i = +e.target.dataset.remove;
  if (products.length > 1) {
    products.splice(i, 1);
    renderProductRows();
    updatePreview();
  }
}

document.getElementById('btn-add-product').addEventListener('click', () => {
  products.push({ name: '', qty: '', price: '' });
  renderProductRows();
});

// ── Update preview ──
function v(id) { return document.getElementById(id)?.value?.trim() || ''; }

function updatePreview() {
  // company info block
  document.getElementById('pv-company-info').innerHTML =
    `${v('f-company')}<br>106 台北市大安區和平東路二段175巷56號<br>統一編號：94016693<br>${v('f-company-tel')}`;

  // info table
  const fields = {
    'pv-buyer': 'f-buyer', 'pv-buyer-tel': 'f-buyer-tel',
    'pv-date': 'f-date', 'pv-expiry': 'f-expiry',
    'pv-receiver': 'f-receiver', 'pv-tax-id': 'f-tax-id',
    'pv-address': 'f-address', 'pv-recv-tel': 'f-recv-tel',
  };
  for (const [pvId, fId] of Object.entries(fields)) {
    document.getElementById(pvId).textContent = v(fId);
  }

  // products
  const tbody = document.getElementById('pv-products');
  tbody.innerHTML = '';
  let subtotal = 0;
  products.forEach((p, i) => {
    const qty = parseFloat(p.qty) || 0;
    const price = parseFloat(p.price) || 0;
    const amount = qty * price;
    if (p.name || qty || price) subtotal += amount;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.name || qty || price ? i + 1 : ''}</td>
      <td class="product-name">${p.name || ''}</td>
      <td>${p.qty !== '' && p.qty != null ? p.qty : ''}</td>
      <td>${price ? price.toLocaleString('en', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : ''}</td>
      <td>${(p.name || qty || price) && amount ? Math.round(amount).toLocaleString() : ''}</td>
    `;
    tbody.appendChild(tr);
  });

  // summary
  const taxRate = parseFloat(v('f-tax-rate')) / 100 || 0.05;
  const tax = Math.round(subtotal * taxRate);
  const total = subtotal + tax;

  const tfoot = document.getElementById('pv-summary');
  tfoot.innerHTML = `
    <tr>
      <td colspan="4" class="summary-label">合計</td>
      <td class="summary-value">${Math.round(subtotal).toLocaleString()}</td>
    </tr>
    <tr>
      <td colspan="4" class="summary-label">稅金（${Math.round(taxRate * 100)}%）</td>
      <td class="summary-value">${tax.toLocaleString()}</td>
    </tr>
    <tr>
      <td colspan="4" class="summary-label" style="font-weight:700">總計</td>
      <td class="summary-value" style="font-weight:700">${total.toLocaleString()}</td>
    </tr>
  `;

  // notes
  const notes = v('f-notes');
  const notesWrap = document.getElementById('pv-notes-wrap');
  if (notes) {
    const lines = notes.split('\n').filter(l => l.trim());
    notesWrap.innerHTML = `<div class="notes-title">【備註】</div>` +
      lines.map((l, i) => `<div>${i + 1}. ${l}</div>`).join('');
  } else {
    notesWrap.innerHTML = '';
  }

  // sig right
  document.getElementById('pv-sig-right').innerHTML = `
    <div>公司名稱：${v('f-company')}</div>
    <div>聯絡人：&nbsp;&nbsp;&nbsp;&nbsp;${v('f-contact')}</div>
    <div>聯絡電話：${v('f-company-tel')}</div>
    <div>E-mail：&nbsp;&nbsp;&nbsp;&nbsp;${v('f-email')}</div>
    <div style="margin-top:12px">
      <div class="pv-stamp">歐飲國際<br>股份有限公司</div>
    </div>
  `;
}

// ── Live binding ──
const inputIds = ['f-buyer','f-buyer-tel','f-date','f-expiry','f-receiver','f-tax-id',
  'f-address','f-recv-tel','f-tax-rate','f-notes','f-company','f-contact','f-company-tel','f-email'];
inputIds.forEach(id => {
  document.getElementById(id)?.addEventListener('input', updatePreview);
});

// ── Reset ──
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('確定要重設所有欄位嗎？')) return;
  products = [{ name: '', qty: '', price: '' }];
  renderProductRows();
  document.getElementById('f-buyer').value = '';
  document.getElementById('f-buyer-tel').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-expiry').value = '';
  document.getElementById('f-receiver').value = '';
  document.getElementById('f-tax-id').value = '';
  document.getElementById('f-address').value = '';
  document.getElementById('f-recv-tel').value = '';
  document.getElementById('f-tax-rate').value = '5';
  document.getElementById('f-notes').value = '';
  updatePreview();
});

// ── Init ──
renderProductRows();
updatePreview();
</script>
</body>
</html>
